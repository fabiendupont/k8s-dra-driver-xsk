apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-xsk-driver
  namespace: kube-system
  labels:
    app: dra-xsk-driver
spec:
  selector:
    matchLabels:
      app: dra-xsk-driver
  template:
    metadata:
      labels:
        app: dra-xsk-driver
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: dra-xsk-driver

      # XDP-capable nodes must be labelled:
      #   xsk.dra.io/capable: "true"
      nodeSelector:
        xsk.dra.io/capable: "true"

      containers:
        - name: driver
          image: quay.io/fabiendupont/dra-xsk-driver:latest
          command:
            - /usr/bin/dra-xsk
          args:
            - --node-name=$(NODE_NAME)
            - --driver-name=xsk.dra.io
            - --handoff-dir=/run/xsk
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # The native backend loads XDP and creates AF_XDP sockets
            # in-process: CAP_BPF + CAP_NET_ADMIN required, nothing else.
            capabilities:
              drop: ["ALL"]
              add: ["CAP_BPF", "CAP_NET_ADMIN"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: plugin-socket-dir
              mountPath: /var/lib/kubelet/plugins/xsk.dra.io
            - name: cdi-dir
              mountPath: /etc/cdi
            - name: handoff-dir
              mountPath: /run/xsk
            - name: sysfs-bpf
              mountPath: /sys/fs/bpf

      volumes:
        - name: plugin-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/xsk.dra.io
            type: DirectoryOrCreate
        - name: cdi-dir
          hostPath:
            path: /etc/cdi
            type: DirectoryOrCreate
        - name: handoff-dir
          hostPath:
            path: /run/xsk
            type: DirectoryOrCreate
        - name: sysfs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
