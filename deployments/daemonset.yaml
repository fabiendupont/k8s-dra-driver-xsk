apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-xsk-driver
  namespace: kube-system
  labels:
    app: dra-xsk-driver
spec:
  selector:
    matchLabels:
      app: dra-xsk-driver
  template:
    metadata:
      labels:
        app: dra-xsk-driver
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: dra-xsk-driver

      # XDP-capable nodes must be labelled:
      #   xsk.dra.io/capable: "true"
      nodeSelector:
        xsk.dra.io/capable: "true"

      containers:
        - name: driver
          image: quay.io/fabiendupont/dra-xsk-driver:latest
          command:
            - /usr/bin/dra-xsk
          args:
            - --node-name=$(NODE_NAME)
            - --driver-name=xsk.dra.io
            - --handoff-dir=/run/xsk
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # The native backend loads XDP and creates AF_XDP sockets
            # in-process: CAP_BPF (program/map load) + CAP_NET_ADMIN
            # (XDP attach) required. CAP_SYS_RESOURCE is NOT needed on
            # kernels >= 5.11 (BPF memory is memcg-accounted; the
            # driver's memlock raise is a no-op there). Root is needed
            # for the kubelet plugin registration socket and CDI
            # writes into root-owned directories — the standard
            # posture for node DRA drivers. See README (Security) for
            # the full analysis and the bpfman-backend path to fewer
            # privileges.
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["CAP_BPF", "CAP_NET_ADMIN", "CAP_NET_RAW", "CAP_SYS_RESOURCE"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: plugin-socket-dir
              mountPath: /var/lib/kubelet/plugins/xsk.dra.io
            - name: plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: cdi-dir
              mountPath: /etc/cdi
            - name: handoff-dir
              mountPath: /run/xsk

      volumes:
        - name: plugin-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/xsk.dra.io
            type: DirectoryOrCreate
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: cdi-dir
          hostPath:
            path: /etc/cdi
            type: DirectoryOrCreate
        - name: handoff-dir
          hostPath:
            path: /run/xsk
            type: DirectoryOrCreate
