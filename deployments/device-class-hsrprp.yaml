# HSR/PRP redundant stream class: claims allocate a logical stream
# (redundancy group × EtherType) whose deduplicated frames are
# delivered to the pod's AF_XDP socket. The claim survives a ring
# port failure — the device is the group, not a physical queue.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: hsr-prp-stream
spec:
  selectors:
    - cel:
        # device.attributes is grouped by driver prefix; unknown
        # fields abort allocation, so guard with 'in' (queue devices
        # from the same driver have no 'type').
        expression: >-
          device.driver == "xsk.dra.io" &&
          'type' in device.attributes["xsk.dra.io"] &&
          device.attributes["xsk.dra.io"].type == "hsr-prp-stream"
