# Node-level HSR/PRP RedBox configuration for the DRA driver.
#
# Defines the redundancy groups wired on this node: pairs of ring
# ports (HSR) whose deduplicated streams are exposed as DRA devices
# (one device per group × EtherType). Mounted into the driver
# DaemonSet at /etc/xsk-dra/hsrprp.yaml (--hsrprp-config).
#
# NOTE: one config for the whole cluster means every node must have
# these interfaces. For heterogeneous fleets, use a per-node
# ConfigMap + nodeSelector. This is prototype-shaped: in production
# this becomes NodeConfig or a per-node ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dra-xsk-hsrprp
  namespace: kube-system
data:
  hsrprp.yaml: |
    groups:
      - name: ring1
        mode: hsr
        ports: [ring0a, ring0b]
        streams:
          - ethertype: "0x88B8"   # GOOSE
          - ethertype: "0x88BA"   # SV
