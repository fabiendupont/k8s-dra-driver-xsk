{{- $driver := .Values.driverName -}}
# Generic XSK class: EtherType filters come from the claim's
# parameters (see deployments/examples/claim-generic.yaml).
# Names are fixed (matching deployments/device-class.yaml) so claims
# work identically under the chart and the raw manifests.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: xsk
  labels:
    {{- include "k8s-dra-driver-xsk.labels" . | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: device.driver == "{{ $driver }}"
---
# IEC 61850 preset: claims via this class get GOOSE + SV filters by
# default; claim-level parameters still override the class config.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: xsk-iec61850
  labels:
    {{- include "k8s-dra-driver-xsk.labels" . | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: device.driver == "{{ $driver }}"
  config:
    - opaque:
          driver: {{ $driver }}
          parameters:
            apiVersion: {{ $driver }}/v1alpha1
            kind: XSKParameters
            ethertypes: ["0x88B8", "0x88BA"]
{{- if .Values.hsrprp.enabled }}
---
# HSR/PRP redundant stream class: claims allocate a logical stream
# (redundancy group × EtherType) whose deduplicated frames are
# delivered to the pod's AF_XDP socket. The claim survives a ring
# port failure — the device is the group, not a physical queue.
# device.attributes is grouped by driver prefix in CEL; unknown
# fields abort allocation, so guard with 'in' (queue devices from
# the same driver have no 'type').
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: hsr-prp-stream
  labels:
    {{- include "k8s-dra-driver-xsk.labels" . | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "{{ $driver }}" &&
          'type' in device.attributes["{{ $driver }}"] &&
          device.attributes["{{ $driver }}"].type == "hsr-prp-stream"
{{- end }}
